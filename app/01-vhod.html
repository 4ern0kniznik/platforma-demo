<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · Platforma</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div style="background:#FEF3C7;color:#78350F;padding:12px 16px;font:14px/1.4 system-ui,sans-serif;text-align:center;border-bottom:1px solid #F5D98B">Снимок приложения v0.2.0 от 16.09.2026, данные вымышленные, формы не работают.</div>
<div class="frame-outer"><div class="frame frame-narrow">


<div class="logo-big">Platforma</div>
<div class="card">

  <h1>Вход</h1>
  <p class="subtitle">Введите номер телефона, на который вас пригласил администратор.
    Мы пришлём код по SMS.</p>
  <form method="post" action="#">
    <div class="field ">
      <label for="phone">Номер телефона</label>
      <input id="phone" name="phone" type="tel" inputmode="tel" value=""
             placeholder="+7 (___) ___-__-__">
      
    </div>
    <button type="submit" class="btn btn-primary">Получить код</button>
  </form>
  <p class="hint">Самостоятельная регистрация не работает — номер заводит администратор Platforma.</p>

</div>

</div></div>
</body>
</html>
